<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動態歌詞播放器（第二版本）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0c14; --panel:#17131e; --panel2:#201a2a; --line:#2e2639; --text:#efe9f5; --muted:#9d93ab;
  --pink:#ff6fae; --pink2:#ffb3d4; --sky:#8fd3ff;
  --hiA:#ff4f9a; --hiB:#ffa6d2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
header h1 span{color:var(--pink)}
header .song{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .pv-link{margin-left:auto;align-self:center;flex:none;font-size:13px;font-weight:700;color:#fff;text-decoration:none;padding:5px 12px;border-radius:999px;background:var(--pink)}
header .pv-link:hover{filter:brightness(1.1)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px;max-width:1680px;margin:0 auto}
.layout>section{min-width:0}
@media (min-width:1001px){
  html,body{height:100%;overflow:hidden}
  body{height:100dvh;display:flex;flex-direction:column}
  header{flex:none}
  .layout{flex:1;min-height:0;width:100%;grid-template-rows:minmax(0,1fr)}
  .layout>section{display:flex;flex-direction:column;min-height:0}
  .layout #stage{flex:1;min-height:0;aspect-ratio:auto}
  .layout .bar,.layout .opts,.layout .dance-controls{flex:none}
  .layout .panel{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
  .layout .panel>.card{flex:none}
}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr;padding:12px;gap:12px}
  header{padding:12px;gap:10px}
  .bar{flex-wrap:wrap;gap:8px}
  #seek{flex-basis:100%;order:1}
}

/* ---------- stage ---------- */
#stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none}
#stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
#yt,#localVideo{position:absolute;inset:0;width:100%;height:100%;border:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#localVideo{object-fit:contain;background:#000}
#cover{position:absolute;inset:0;overflow:hidden;background:#140a18}
#cover .bg{position:absolute;inset:-10%;background:var(--img) center/cover;filter:blur(38px) brightness(.55) saturate(1.3)}
#cover .art{position:absolute;left:50%;top:44%;height:74%;aspect-ratio:1;translate:-50% -50%;border-radius:1.2cqw;background:var(--img) center/cover;box-shadow:0 2cqw 5cqw rgba(0,0,0,.55);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{scale:1.025}}
#srcSeg button{padding:4px 10px;font-size:12.5px}
#dim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(12,4,20,.78) 0%,rgba(12,4,20,.3) 42%,rgba(12,4,20,0) 68%);transition:opacity .4s}
#dim.off{opacity:0}
#fx,#dance{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#dance[hidden]{display:none}
#stage.dancing #cover .art{opacity:.12;filter:blur(3px);height:100%;top:50%}
#stage.dancing #cover .bg{filter:blur(38px) brightness(.25) saturate(1.2)}
#stage.dancing #titlecard{justify-content:flex-start;padding-top:3%}
#stage.dancing #titlecard .t1{font-size:3.5cqw}
#stage.dancing #titlecard .t2{font-size:1.3cqw;margin-top:.5cqw}
.dance-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.dance-controls[hidden]{display:none}
.dance-controls select{max-width:160px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
#danceStatus{font-size:12px;color:var(--sky)}
#catcher{position:absolute;inset:0;cursor:pointer}
#lyrics{position:absolute;left:4%;right:4%;bottom:8%;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:1.1cqw}
.slot{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;width:100%;justify-items:center;align-items:end}
.slot>.linewrap{grid-area:1/1}
.linewrap{display:flex;flex-direction:column;align-items:center;gap:.8cqw;min-width:0;max-width:100%}
.line{--scale:1;--fit:1;width:max-content;max-width:96%;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:calc(4.6cqw*var(--scale)*var(--fit));line-height:1.35;text-align:center;letter-spacing:.04em;text-wrap:balance;
  filter:drop-shadow(0 .14cqw 0 rgba(40,0,30,.65)) drop-shadow(0 0 1.1cqw rgba(0,0,0,.5))}
.ch{display:inline-block;white-space:pre}
#next,.next-measure{--fit:1;max-width:96%;font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:calc(2.1cqw*var(--scale,1)*var(--fit));line-height:1.4;color:rgba(255,255,255,.6);min-height:1.4em;transition:opacity .35s;filter:drop-shadow(0 0 .5cqw rgba(0,0,0,.9));text-align:center;text-wrap:balance}
#next.off{opacity:0}
#nextZh,.zh-preview{--fit:1;max-width:96%;font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:calc(1.75cqw*var(--scale,1)*var(--fit));line-height:1.4;color:rgba(255,255,255,.55);min-height:1.3em;transition:opacity .35s;filter:drop-shadow(0 0 .5cqw rgba(0,0,0,.9));text-align:center;text-wrap:balance}
#nextZh.off{opacity:0}

/* title card */
#titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s;text-align:center;padding:0 6%}
#titlecard.show{opacity:1}
#titlecard .t1{font-family:"Zen Maru Gothic";font-weight:900;font-size:6cqw;line-height:1.2;background:linear-gradient(100deg,#fff 10%,var(--pink2) 45%,var(--pink) 70%,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 .2cqw .6cqw rgba(0,0,0,.6))}
#titlecard .t2{margin-top:1.4cqw;font-family:"Zen Maru Gothic";font-weight:700;font-size:2cqw;color:rgba(255,255,255,.85);letter-spacing:.3em;filter:drop-shadow(0 0 .5cqw rgba(0,0,0,.9))}
@keyframes shine{to{background-position:-200% 0}}

#tapBadge{position:absolute;top:2.2cqw;left:2.2cqw;display:none;align-items:center;gap:.8cqw;padding:.7cqw 1.4cqw;border-radius:99px;background:rgba(20,8,24,.72);backdrop-filter:blur(6px);font-size:max(12px,1.4cqw);pointer-events:none;max-width:70%}
#tapBadge.show{display:flex}
#tapBadge .dot{width:.9em;height:.9em;border-radius:50%;background:#ff3b6b;animation:blink 1s infinite}
#tapBadge .nx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--pink2)}
@keyframes blink{50%{opacity:.25}}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:8%;background:rgba(0,0,0,.8);line-height:1.8;font-size:max(13px,1.6cqw)}
#msg.show{display:flex}

/* ---------- effects ---------- */
/* 卡拉OK填色 */
.fx-karaoke .ch{
  background:linear-gradient(90deg,var(--hiA),var(--hiB) calc(var(--c,0)*100%),#fff 0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  translate:0 calc(var(--c,0)*(1 - var(--c,0))*-.45em);
  animation:kIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*16ms)}
@keyframes kIn{from{opacity:0;transform:translateY(.45em)}}

/* 逐字彈跳 */
.fx-pop .ch{
  color:hsl(calc(var(--h,330) + var(--i)*11) 100% calc(80% + var(--c,0)*15%));
  translate:0 calc(var(--c,0)*(1 - var(--c,0))*-1.3em);
  scale:calc(1 + var(--c,0)*(1 - var(--c,0))*.9);
  animation:popIn .65s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:calc(var(--i)*50ms)}
@keyframes popIn{from{opacity:0;transform:translateY(.9em) scale(.2) rotate(-28deg)}}

/* 霓虹 */
.line.fx-neon{filter:none;animation:flick .9s linear both}
.fx-neon .ch{color:#fff;opacity:calc(.4 + var(--c,0)*.6);
  text-shadow:0 0 .04em #fff,0 0 .16em var(--neon),0 0 .4em var(--neon),0 0 .85em var(--neon)}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.15}18%{opacity:1}22%{opacity:.35}28%,100%{opacity:1}}

/* 逐字浮現 */
.fx-type .ch{color:#fff;opacity:clamp(0,var(--c,0)*8,1);
  translate:0 calc((1 - clamp(0,var(--c,0)*3,1))*.4em);
  text-shadow:0 0 calc(var(--c,0)*(1 - var(--c,0))*2.4em) var(--pink)}

/* 柔焦夢幻 */
.fx-dream .ch{
  background:linear-gradient(180deg,#fff 30%,hsl(calc(var(--h,330) + var(--i)*7) 95% 84%));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:calc(.5 + var(--c,0)*.5);
  animation:dreamIn 1.2s ease backwards;animation-delay:calc(var(--i)*65ms)}
@keyframes dreamIn{from{opacity:0;filter:blur(12px);transform:translateY(.4em) scale(1.35)}}

/* 和聲（［］《》內文字） */
.line .ch.bk{font-size:.62em;font-weight:700;vertical-align:.35em}
.line.allbk .ch.bk{font-size:.85em;vertical-align:0}
.ch ruby{ruby-position:over}
.ch rt{font-size:.4em;font-weight:700;letter-spacing:0;line-height:1}
.line .ch.bk:first-of-type,.line .ch:not(.bk)+.ch.bk{margin-left:.35em}
.fx-karaoke .ch.bk{background:linear-gradient(90deg,#6fd0ff,#b9e8ff calc(var(--c,0)*100%),rgba(255,255,255,.75) 0);-webkit-background-clip:text;background-clip:text}
.fx-pop .ch.bk,.fx-type .ch.bk{color:#9edcff}
.fx-neon .ch.bk{--neon:#3fb8ff}

/* 中文翻譯行：隨時間由左至右填色 */
.zhline{--p:0;display:block;max-width:96%;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:calc(2.45cqw*var(--scale,1)*var(--fit,1));line-height:1.4;text-align:center;letter-spacing:.06em;text-wrap:balance;
  background:linear-gradient(90deg,hsl(var(--h,330) 100% 84%) calc(var(--p)*100%),rgba(255,255,255,.78) 0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .12cqw 0 rgba(40,0,30,.6)) drop-shadow(0 0 1cqw rgba(0,0,0,.55));
  animation:zhIn .55s ease backwards;animation-delay:.12s}
@keyframes zhIn{from{opacity:0;translate:0 .4em}}

.linewrap.leave>*{animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:translateY(-1.5em) scale(.9);filter:blur(8px)}}

/* ---------- controls ---------- */
.bar{display:flex;align-items:center;gap:12px;margin-top:12px}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--pink);color:#2a0717;display:grid;place-items:center;cursor:pointer;flex:none}
.icon.ghost{background:var(--panel2);color:var(--text)}
.icon svg{width:18px;height:18px}
#timeLbl{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;min-width:92px}
input[type=range]{accent-color:var(--pink)}
#seek{flex:1;min-width:0}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel2);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--pink);color:#2a0717;font-weight:700}
.opt{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.opt input[type=range]{width:90px}
.opt .mini{border:1px solid var(--line);background:var(--panel2);width:26px;height:26px;border-radius:6px;cursor:pointer;padding:0}
#offLbl{min-width:44px;text-align:center;color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- side panel ---------- */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .hint{font-weight:400;color:var(--muted)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.btn,.card button.b{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover,.card button.b:hover{border-color:#4a3d5a}
.card button.primary{background:var(--pink);color:#2a0717;border-color:var(--pink);font-weight:700}
.card button.primary.rec{background:#ff3b6b;border-color:#ff3b6b;color:#fff}
.card button:disabled{opacity:.4;cursor:default}
.filepick{display:block;margin-top:10px;color:var(--muted);font-size:12.5px}
.filepick input{margin-left:6px;max-width:100%}
textarea{width:100%;height:210px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;line-height:1.6;font-family:"Noto Sans TC",monospace}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.keys{margin:10px 0 0;color:var(--muted);font-size:12.5px;line-height:1.8}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:inherit;font-size:11.5px;color:var(--text)}
#list{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto;position:relative}
#list li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;font-size:13px}
#list li:hover{background:var(--panel2)}
#list li.active{background:rgba(255,111,174,.14)}
#list li.active .tx{color:var(--pink2);font-weight:700}
#list li.target{outline:1px dashed #ff3b6b}
#list li.blank .tx{color:var(--muted);font-style:italic}
#list .t{border:0;background:none;color:var(--sky);font-variant-numeric:tabular-nums;cursor:pointer;padding:0;font-size:12px;width:62px;text-align:left;flex:none}
#list .t.none{color:#5c5268}
#list .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .ops{display:flex;gap:2px;opacity:0;flex:none}
#list li:hover .ops{opacity:1}
#list .ops button{border:0;background:var(--line);width:22px;height:22px;border-radius:5px;cursor:pointer;font-size:12px;padding:0}
#count{font-weight:400;color:var(--muted)}
#songs{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:4px}
#songs li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
#songs li:hover{background:var(--panel2)}
#songs li.on{background:rgba(255,111,174,.12);border-color:rgba(255,111,174,.35)}
#songs .no{width:18px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;text-align:center}
#songs li.on .no{color:var(--pink)}
#songs .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#songs li.on .nm{color:var(--pink2);font-weight:700}
#songs .st{font-size:11.5px;color:var(--muted);flex:none}
#songs .st.ok{color:#7fe0b0}
#songs .del{border:0;background:none;color:var(--muted);cursor:pointer;opacity:0;padding:0 2px;font-size:15px;flex:none}
#songs li:hover .del{opacity:1}
#toast{position:fixed;left:50%;bottom:28px;translate:-50% 0;background:#2b2236;border:1px solid #4a3d5a;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
@media (max-width:1000px){#seek{flex:1 0 100%;order:1}}
</style>
</head>
<body>
<header>
  <h1>動態歌詞<span>♡</span>播放器</h1>
  <div class="song" id="songLbl">大好きだよって叫ぶんだ [小日向理瀬ver.]</div>
  <a class="pv-link" href="index.html">🎬 回 PV 首頁</a>
</header>

<main class="layout">
  <section>
    <div id="stage">
      <div id="cover" hidden><div class="bg"></div><div class="art"></div></div>
      <div id="yt"></div>
      <video id="localVideo" hidden playsinline></video>
      <div id="dim"></div>
      <canvas id="dance"></canvas>
      <canvas id="fx"></canvas>
      <div id="titlecard"><div class="t1"></div><div class="t2"></div></div>
      <div id="lyrics"><div class="slot" id="slot"></div><div id="next"></div><div id="nextZh" class="off"></div></div>
      <div id="catcher" title="點擊播放／暫停，雙擊全螢幕"></div>
      <div id="tapBadge"><span class="dot"></span><span>打點中</span><span class="nx" id="tapNext"></span></div>
      <div id="msg"></div>
    </div>

    <div class="bar">
      <button class="icon" id="playBtn" title="播放／暫停 (K)"></button>
      <span id="timeLbl">0:00 / 0:00</span>
      <div class="seg" id="srcSeg" hidden title="音源"><button data-src="mp3">MP3</button><button data-src="yt">YouTube</button></div>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <button class="icon ghost" id="fsBtn" title="全螢幕 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>

    <div class="opts">
      <div class="seg" id="effects">
        <button data-fx="karaoke">卡拉OK填色</button>
        <button data-fx="pop">逐字彈跳</button>
        <button data-fx="neon">霓虹燈</button>
        <button data-fx="type">逐字浮現</button>
        <button data-fx="dream">柔焦夢幻</button>
      </div>
      <label class="opt">字級 <input type="range" id="scale" min="0.6" max="1.6" step="0.05"></label>
      <span class="opt" title="正值＝字幕提前出現">時間偏移
        <button class="mini" data-off="-0.1">−</button><span id="offLbl">0.0s</span><button class="mini" data-off="0.1">+</button>
      </span>
      <label class="opt"><input type="checkbox" id="partChk"> 愛心粒子</label>
      <label class="opt"><input type="checkbox" id="dimChk"> 背景暗化</label>
      <label class="opt"><input type="checkbox" id="nextChk"> 下一句預覽</label>
      <label class="opt"><input type="checkbox" id="danceChk"> 載歌載舞</label>
    </div>
    <div class="dance-controls" id="danceControls">
      <label class="opt">人物 <select id="danceStyle"><option value="anime">參考人物</option><option value="chibi">Q 版偶像</option></select></label>
      <label class="opt">主唱 <select id="danceLead"><option value="auto">歌曲預設</option><option value="0">小日向理瀬</option><option value="1">葉山陽和</option><option value="2">前原純華</option><option value="3">小鷹咲希</option><option value="4">橘雪乃</option><option value="5">御社智</option></select></label>
      <label class="opt">舞動強度 <input id="danceEnergy" type="range" min="0.3" max="1.8" step="0.1" value="1"></label>
      <span id="danceStatus" role="status">載入人物素材…</span>
    </div>
  </section>

  <aside class="panel">
    <div class="card">
      <h2>歌曲清單</h2>
      <ul id="songs"></ul>
      <p class="keys">預設 LRC 的時間為估算值，可用「開始打點」校準。</p>
      <div class="row">
        <input id="ytInput" placeholder="貼上 YouTube 網址新增歌曲" spellcheck="false">
        <button class="b" id="ytLoad">新增</button>
      </div>
      <label class="filepick">或使用本機影音檔<input type="file" id="fileInput" accept="video/*,audio/*"></label>
    </div>

    <div class="card">
      <h2>歌詞 <span class="hint">貼上純文字，或匯入 LRC</span></h2>

      <div class="btns">
        <button class="b primary" id="tapBtn">開始打點</button>
        <button class="b" id="undoBtn" disabled>復原上一句</button>
        <button class="b" id="markBtn">插入間奏</button>
        <button class="b" id="clearBtn">清除時間</button>
        <button class="b" id="exportBtn">匯出 LRC</button>

      </div>
      <p class="keys">
        <kbd>Space</kbd> 打點時標記下一句／平時播放暫停 · <kbd>Backspace</kbd> 復原 ·
        <kbd>.</kbd> 間奏（清空字幕） · <kbd>←</kbd><kbd>→</kbd> 快退／快進 3 秒 · <kbd>F</kbd> 全螢幕 · <kbd>Esc</kbd> 結束打點
      </p>
    </div>

    <div class="card">
      <h2>時間軸 <span id="count"></span></h2>

  </aside>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), slot = $('#slot'), nextEl = $('#next'), nextZhEl = $('#nextZh'), listEl = $('#list'), ta = $('#lyricsText');
const vid = $('#localVideo');
const HUES = [330, 290, 200, 345, 265, 185, 315];
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const prefs = Object.assign({effect:'karaoke', scale:1, particles:true, dim:true, next:true, dance:true, danceStyle:'anime', danceLead:'auto', danceEnergy:1}, store.get('lyricfx:prefs') || {});
const savePrefs = () => store.set('lyricfx:prefs', prefs);

let mediaKey = 'yt:C3G_fAPgQNk';
let lines = [], timed = [], offset = 0;
let tapping = false, tapIdx = 0, curSrcHash = null;
let songTitle = $('#songLbl').textContent;

/* ---------------- time helpers ---------------- */
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
function fmt(t){ const m = Math.floor(t/60), s = t - m*60; return String(m).padStart(2,'0') + ':' + s.toFixed(2).padStart(5,'0'); }
function fmtShort(t){ t = Math.max(0, t|0); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }

/* ---------------- media abstraction ---------------- */
const media = {
  kind:'yt', yt:null, ready:false, clock:{v:0, at:0}, last:0,
  time(){
    if(this.kind === 'file') return vid.currentTime;
    if(!this.ready) return 0;
    // YouTube 的 getCurrentTime 更新較粗，這裡用 performance.now() 內插讓填色更平滑
    const v = this.yt.getCurrentTime() || 0, now = performance.now();
    if(v !== this.clock.v){ this.clock = {v, at:now}; }
    let t = v;
    if(this.playing()) t = v + Math.min(1, (now - this.clock.at)/1000 * (this.yt.getPlaybackRate() || 1));
    if(this.playing() && t < this.last && this.last - t < .25) t = this.last;
    this.last = t;
    return t;
  },
  duration(){ return this.kind === 'file' ? (vid.duration || 0) : (this.ready ? this.yt.getDuration() || 0 : 0); },
  playing(){ return this.kind === 'file' ? !vid.paused : (this.ready && this.yt.getPlayerState() === 1); },
  play(){ this.kind === 'file' ? vid.play() : this.ready && this.yt.playVideo(); },
  pause(){ this.kind === 'file' ? vid.pause() : this.ready && this.yt.pauseVideo(); },
  seek(t){ t = Math.max(0, t); this.last = 0; this.clock = {v:t, at:performance.now()};
    this.kind === 'file' ? (vid.currentTime = t) : this.ready && this.yt.seekTo(t, true); },
  toggle(){ this.playing() ? this.pause() : this.play(); }
};

function parseYtId(s){
  s = s.trim();
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if(m) return m[1];
  return /^[\w-]{11}$/.test(s) ? s : null;
}

window.onYouTubeIframeAPIReady = () => {
  media.yt = new YT.Player('yt', {
    videoId: mediaKey.startsWith('yt:') ? mediaKey.slice(3) : undefined,
    playerVars: {controls:0, disablekb:1, fs:0, rel:0, playsinline:1, iv_load_policy:3, modestbranding:1, origin: location.origin},
    events: {
      onReady(){
        media.ready = true;
        const pending = pendingYt; pendingYt = null;
        if(pending){
          const action = pending.autoplay ? 'loadVideoById' : 'cueVideoById';
          media.yt[action]({videoId:pending.id, startSeconds:pending.at});

        updateTitleFromYt();
      },
      onStateChange(){ updateTitleFromYt(); },
      onError(e){
        const why = {2:'影片 ID 無效', 5:'播放器錯誤', 100:'找不到影片', 101:'影片擁有者禁止嵌入播放', 150:'影片擁有者禁止嵌入播放', 153:'需要透過 http://localhost 開啟本頁'}[e.data] || ('錯誤碼 ' + e.data);

      }

};
function updateTitleFromYt(){

}
function setTitle(){

}
function showMsg(html){ const m = $('#msg'); m.innerHTML = html; m.classList.toggle('show', !!html); }

/* ---------------- song list ---------------- */
const DEFAULT_SONGS = [
  {id: 'C3G_fAPgQNk', title: '大好きだよって叫ぶんだ [小日向理瀬ver.]',
   audio: '大好きだよって叫ぶんだ [小日向理瀬ver.].mp3',
   subs: 'Subtitle_この想いは止められないよ いつだって眩...も_1790793102916.srt', lead: 0},
  {id: 'UkGtRu6X72E', title: 'SUNRISE [小日向理瀬ver.]',
   audio: 'SUNRISE [小日向理瀬ver.].mp3',
   subs: 'Subtitle_《SUN RISE…》手をとっては競い...…_1790794218236.srt', lead: 0},
  {id: '1BV6fsfu7ZU', title: 'HELLO HERO [御社 智ver.]',
   audio: 'HELLO HERO [御社 智ver.].mp3',
   subs: 'Subtitle_これまでもこれからも　変わらずいるよヨ...る_1790795207681.srt', lead: 5},
  {id: 'rNbXIeLdU0M', title: '風の中は走るっきゃないっ！ [三月のパンタシア]',
   audio: '風の中は走るっきゃないっ！ [三月のパンタシア].mp3',
   subs: '風の中は走るっきゃないっ！.srt', lead: 0, cast: 'anaru'}
];
// 每首歌的字幕／音訊檔放在同一個資料夾，執行時才讀取
const cfgOf = id => DEFAULT_SONGS.find(d => d.id === id) || {};
const fileLrc = {};   // id -> {lrc, hash}
const hashStr = s => { let h = 5381; for(let i = 0; i < s.length; i++) h = (h*33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
async function preloadFiles(){
  await Promise.all(DEFAULT_SONGS.filter(d => d.subs).map(async d => {
    try{
      const r = await fetch(encodeURIComponent(d.subs), {cache: 'no-cache'});
      if(!r.ok) return;
      const ls = parse(await r.text());
      const lrc = toLRC(ls);
      const zh = {};
      for(const l of ls) if(l.zh) zh[l.text] = l.zh;
      fileLrc[d.id] = {lrc, hash: hashStr(lrc), zh};
    }catch{}
  }));
}
function getLyricsData(key){
  const saved = store.get('lyricfx:' + key);
  const f = key.startsWith('yt:') ? fileLrc[key.slice(3)] : null;
  // 字幕檔有更新（或從未載入過）時以檔案為準；否則保留使用者在頁面上的修改
  if(f && saved?.srcHash !== f.hash) return {lrc: f.lrc, offset: saved?.offset || 0, srcHash: f.hash};
  return saved;
}
let songs = store.get('lyricfx:songs') || [];
let removedSongs = store.get('lyricfx:removed') || [];
const saveSongs = () => { store.set('lyricfx:songs', songs); store.set('lyricfx:removed', removedSongs); };
// 預設清單新增的歌曲會自動補進已存的清單（使用者刪掉的不會再補回）
for(const d of DEFAULT_SONGS) if(!songs.some(s => s.id === d.id) && !removedSongs.includes(d.id)) songs.push({...d});

function renderSongs(){
  const ul = $('#songs'); ul.innerHTML = '';
  songs.forEach((s, i) => {
    const d = getLyricsData('yt:' + s.id);
    const ls = d?.lrc ? parse(d.lrc) : [];
    const nt = ls.filter(l => l.t != null && l.text).length, n = ls.filter(l => l.text).length;
    const li = document.createElement('li');
    li.dataset.id = s.id;
    li.classList.toggle('on', mediaKey === 'yt:' + s.id);
    li.innerHTML = `<span class="no">${i + 1}</span><span class="nm"></span><span class="st"></span><button class="del" title="從清單移除">×</button>`;
    li.querySelector('.nm').textContent = s.title;
    const st = li.querySelector('.st');
    st.textContent = (cfgOf(s.id).audio ? 'MP3 · ' : '') + (!n ? '無歌詞' : nt === n ? '已對時' : `${nt}/${n} 句`);
    st.classList.toggle('ok', n > 0 && nt === n);

}
$('#songs').addEventListener('click', e => {
  const li = e.target.closest('li'); if(!li) return;
  const id = li.dataset.id;
  if(e.target.closest('.del')){
    const s = songs.find(x => x.id === id);
    if(!confirm(`從清單移除「${s.title}」？（已存的歌詞會保留，重新加入即可找回）`)) return;
    songs = songs.filter(x => x.id !== id); removedSongs.push(id); saveSongs(); renderSongs(); return;
  }
  playSong(id);
});
let curSong = null, pendingYt = null;
const srcOf = id => cfgOf(id).audio && (prefs.src?.[id] ?? 'mp3') === 'mp3' ? 'mp3' : 'yt';
function applySource(id, autoplay, at = 0){
  pendingYt = null;
  const ytEl = document.getElementById('yt');
  showMsg('');
  if(srcOf(id) === 'mp3'){
    if(media.ready) media.yt.pauseVideo();
    media.kind = 'file'; vid.hidden = true;
    if(ytEl) ytEl.style.visibility = 'hidden';
    const go = () => { vid.currentTime = at; if(autoplay) vid.play().catch(() => {}); };
    // python http.server 不支援 Range，直接串流會無法拖曳進度，所以先整個讀進記憶體
    if(vid._song !== id){
      vid._song = id; vid.removeAttribute('src');
      audioUrl(id).then(url => {
        if(vid._song !== id) return;
        if(!url){
          delete audioUrls[id];
          prefs.src = {...(prefs.src || {}), [id]:'yt'}; savePrefs();
          applySource(id, autoplay, at);
          showMsg('找不到本機 MP3，已切換到 YouTube 音源。');
          return;
        }
        vid.src = url; vid.addEventListener('loadedmetadata', go, {once: true});
      });
    } else go();
    showCover(id);
  } else {
    vid.pause(); vid.hidden = true; media.kind = 'yt';
    // 載歌載舞時用封面當舞台背景（YouTube 仍在背後播放聲音）
    if(ytEl) ytEl.style.visibility = prefs.dance ? 'hidden' : '';
    showCover(prefs.dance ? id : null);
    if(media.ready) autoplay ? media.yt.loadVideoById({videoId: id, startSeconds: at}) : media.yt.cueVideoById({videoId: id, startSeconds: at});
    else pendingYt = {id, autoplay, at};
  }
  const seg = $('#srcSeg');
  seg.hidden = !cfgOf(id).audio;
  seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.src === srcOf(id)));
}
const audioUrls = {};
function audioUrl(id){
  return audioUrls[id] ||= fetch(encodeURIComponent(cfgOf(id).audio))
    .then(r => r.ok ? r.blob() : null).then(b => b && URL.createObjectURL(b)).catch(() => null);
}
function showCover(id){
  const c = $('#cover');
  c.hidden = !id;
  if(id) c.style.setProperty('--img', `url(https://i.ytimg.com/vi/${id}/maxresdefault.jpg)`);
}
$('#srcSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || !curSong || srcOf(curSong) === b.dataset.src) return;
  const t = media.time(), was = media.playing();
  prefs.src = {...prefs.src, [curSong]: b.dataset.src}; savePrefs();
  applySource(curSong, was, t);
});
const LEAD_NAMES = {
  best4u: ['小日向理瀬', '葉山陽和', '前原純華', '小鷹咲希', '橘雪乃', '御社智'],
  anaru: ['水之江梅', '古都吹寿子', '陸奥こころ', '尾鳥たん', '照井有栖', '平塚敏深']
};
function syncLeadMenu(id){
  const names = LEAD_NAMES[cfgOf(id).cast] || LEAD_NAMES.best4u;
  [...$('#danceLead').options].forEach(o => { if(o.value !== 'auto') o.textContent = names[+o.value] || o.textContent; });
}
function playSong(id, autoplay = true){
  const s = songs.find(x => x.id === id);
  curSong = id;
  syncLeadMenu(id);
  applySource(id, autoplay);
  songTitle = s ? s.title : songTitle; setTitle();
  prefs.lastSong = id; savePrefs();
  switchKey('yt:' + id);
  renderSongs();
}
function addSong(){
  const id = parseYtId($('#ytInput').value);
  if(!id){ toast('看不懂這個 YouTube 網址'); return; }
  removedSongs = removedSongs.filter(x => x !== id);
  if(!songs.some(s => s.id === id)) songs.push({id, title: 'YouTube ' + id});
  saveSongs();
  $('#ytInput').value = '';
  playSong(id);
}
$('#ytLoad').onclick = addSong;
$('#ytInput').addEventListener('keydown', e => { if(e.key === 'Enter') addSong(); });

$('#fileInput').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  if(media.ready) media.yt.pauseVideo();
  showMsg('');
  media.kind = 'file'; curSong = null; $('#srcSeg').hidden = true;
  vid._song = null; vid.src = URL.createObjectURL(f);
  const isAudio = f.type.startsWith('audio/');
  vid.hidden = isAudio; $('#cover').hidden = !isAudio; $('#cover').style.setProperty('--img', 'none');
  const ytEl = document.getElementById('yt'); if(ytEl) ytEl.style.visibility = 'hidden';
  songTitle = f.name.replace(/\.[^.]+$/, ''); setTitle();
  switchKey('file:' + f.name);
};

/* ---------------- lyrics model ---------------- */
function parseSrt(text){
  const out = [];
  const tt = s => { const m = s.match(/(\d+):(\d+):(\d+)[,.](\d+)/); return m ? +m[1]*3600 + +m[2]*60 + +m[3] + +('0.' + m[4]) : null; };
  let prevEnd = null;
  for(const block of text.replace(/\r/g, '').split(/\n\s*\n/)){
    const ls = block.split('\n').filter(x => x.trim());
    const i = ls.findIndex(x => x.includes('-->')); if(i < 0) continue;
    const [a, e] = ls[i].split('-->').map(tt); if(a == null) continue;
    const body = ls.slice(i + 1).map(x => x.replace(/<[^>]+>/g, '').trim()).filter(Boolean);
    // 雙語字幕：第二行若不含假名就視為中文翻譯
    let zh = '';
    if(body.length > 1 && !/[\u3040-\u30ff]/.test(body[body.length - 1])) zh = body.pop();
    const text = body.join(' ');
    // 兩句之間空隔超過 1 秒就插入間奏，讓字幕消失
    if(prevEnd != null && a - prevEnd > 1) out.push({t: +prevEnd.toFixed(2), text: ''});
    if(text) out.push(zh ? {t: +a.toFixed(2), text, zh} : {t: +a.toFixed(2), text});
    prevEnd = e;
  }
  if(prevEnd != null) out.push({t: +prevEnd.toFixed(2), text: ''});
  return out.sort((x, y) => x.t - y.t);
}
function parse(text){
  if(/\d+:\d+:\d+[,.]\d+\s*-->/.test(text)) return parseSrt(text);
  const out = [], re = /\[(\d{1,3}):(\d{1,2}(?:[.:]\d{1,3})?)\]/g;
  for(const raw of text.split(/\r?\n/)){
    if(/^\s*\[(ti|ar|al|by|offset|re|ve|length):/i.test(raw)) continue;
    const stamps = [...raw.matchAll(re)];
    const body = raw.replace(re, '').trim();
    if(stamps.length) for(const m of stamps) out.push({t: +m[1]*60 + parseFloat(m[2].replace(':', '.')), text: body});
    else if(body) out.push({t: null, text: body});
  }
  if(out.length && out.every(l => l.t != null)) out.sort((a,b) => a.t - b.t);
  return out;
}
const toLRC = ls => ls.map(l => (l.t != null ? `[${fmt(l.t)}]` : '') + l.text).join('\n');

function commit(fromText){
  timed = lines.filter(l => l.t != null).sort((a,b) => a.t - b.t);
  if(!fromText) ta.value = toLRC(lines);
  store.set('lyricfx:' + mediaKey, {lrc: toLRC(lines), offset, srcHash: curSrcHash});
  renderList();
  updateTapUi();
  if(mediaKey.startsWith('yt:')) renderSongs();
}
function switchKey(key){
  mediaKey = key;
  const d = getLyricsData(key);
  offset = d?.offset || 0; curSrcHash = d?.srcHash || null; $('#offLbl').textContent = offset.toFixed(1) + 's';
  ta.value = d?.lrc || '';
  lines = parse(ta.value);
  zhMap = (key.startsWith('yt:') && fileLrc[key.slice(3)]?.zh) || {};
  stopTap(true);
  slot.replaceChildren(); curLine = null; curEl = null; curWrap = null; curZh = null; nextText = null; nextZhText = null;
  nextEl.textContent = ''; nextZhEl.textContent = '';
  commit(true);
}
let taTimer;
ta.addEventListener('input', () => {
  clearTimeout(taTimer);
  taTimer = setTimeout(() => { lines = parse(ta.value); if(tapping) stopTap(true); commit(true); }, 300);
});

/* ---------------- timeline list ---------------- */
function renderList(){
  listEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  lines.forEach((l, i) => {
    const li = document.createElement('li');
    li.dataset.i = i;
    if(l.text === '') li.classList.add('blank');
    li.innerHTML = `<button class="t${l.t == null ? ' none' : ''}" data-a="go" title="跳到這句">${l.t == null ? '--:--.--' : fmt(l.t)}</button><span class="tx"></span>
      <span class="ops"><button data-a="-" title="提早 0.1 秒">−</button><button data-a="+" title="延後 0.1 秒">+</button><button data-a="now" title="設為目前播放時間">⌖</button><button data-a="from" title="從這句重新打點">●</button></span>`;
    li.querySelector('.tx').textContent = l.text || '（間奏）';
    frag.appendChild(li);
  });
  listEl.appendChild(frag);
  $('#count').textContent = lines.length ? `${timed.length} / ${lines.length} 句已標記時間` : '';
  highlightList(true);
}
listEl.addEventListener('click', e => {
  const b = e.target.closest('button'), li = e.target.closest('li'); if(!li) return;
  const i = +li.dataset.i, l = lines[i];
  const a = b ? b.dataset.a : 'go';
  if(a === 'go'){ if(l.t != null){ media.seek(l.t - offset - .05); media.play(); } return; }
  if(a === 'from'){ startTap(i); return; }
  if(tapping) return;
  if(a === 'now') l.t = +(media.time() + offset).toFixed(2);
  if(l.t == null) return;
  if(a === '-') l.t = Math.max(0, +(l.t - .1).toFixed(2));
  if(a === '+') l.t = +(l.t + .1).toFixed(2);
  commit();
});
let lastHi = null;
function highlightList(force){
  const i = curLine ? lines.indexOf(curLine) : -1;
  if(i === lastHi && !force) return;
  lastHi = i;
  listEl.querySelectorAll('li.active').forEach(x => x.classList.remove('active'));
  const li = listEl.children[i];
  if(li){ li.classList.add('active'); if(!tapping) listEl.scrollTo({top: li.offsetTop - listEl.clientHeight/2, behavior: 'smooth'}); }
}

/* ---------------- tap-to-sync ---------------- */
function startTap(from){
  if(!lines.length){ toast('請先貼上歌詞'); ta.focus(); return; }
  if(from == null){
    from = lines.findIndex(l => l.t == null && l.text !== '');
    if(from < 0){ if(!confirm('每一句都已經有時間了，要從頭重新打點嗎？')) return; from = 0; }
  }
  // 從 from 開始的時間全部重打；舊的間奏標記一併移除
  lines = lines.filter((l, i) => i < from || l.text !== '');
  lines.forEach((l, i) => { if(i >= from) l.t = null; });
  tapIdx = from; tapping = true;
  const prev = lines[from - 1];
  media.seek(prev ? prev.t - offset - 1.5 : 0);
  media.play();
  commit();
  toast('聽到每句開頭時按 Space');
}
function stopTap(silent){
  if(!tapping) { updateTapUi(); return; }
  tapping = false; updateTapUi(); renderList();
  if(!silent) toast('已結束打點');
}
function stamp(){
  if(!tapping) return;
  if(tapIdx >= lines.length){ stopTap(); return; }
  lines[tapIdx].t = +(media.time() + offset).toFixed(2);
  tapIdx++;
  commit();
  if(tapIdx >= lines.length){ tapping = false; commit(); toast('全部打點完成！可以按「匯出 LRC」保存'); }
}
function markGap(){
  const now = +(media.time() + offset).toFixed(2);
  if(tapping){ lines.splice(tapIdx, 0, {t: now, text: ''}); tapIdx++; }
  else {
    const at = lines.findIndex(l => l.t != null && l.t > now);
    lines.splice(at < 0 ? lines.length : at, 0, {t: now, text: ''});
  }
  commit(); toast('已插入間奏 ' + fmt(now));
}
function undo(){
  if(!tapping || tapIdx <= 0) return;
  tapIdx--;
  if(lines[tapIdx].text === '') lines.splice(tapIdx, 1); else lines[tapIdx].t = null;
  const prev = lines[tapIdx - 1];
  media.seek((prev ? prev.t : 0) - offset - .6);
  commit();
}
function updateTapUi(){
  const b = $('#tapBtn');
  b.textContent = tapping ? '結束打點' : '開始打點';
  b.classList.toggle('rec', tapping);
  $('#undoBtn').disabled = !tapping || tapIdx === 0;
  $('#tapBadge').classList.toggle('show', tapping);
  const nx = lines[tapIdx];
  $('#tapNext').textContent = tapping && nx ? '下一句：' + nx.text : '';
  listEl.querySelectorAll('li.target').forEach(x => x.classList.remove('target'));
  if(tapping){
    const li = listEl.children[tapIdx];
    if(li){ li.classList.add('target'); listEl.scrollTo({top: li.offsetTop - listEl.clientHeight/2, behavior: 'smooth'}); }
  }
}
$('#tapBtn').onclick = () => tapping ? stopTap() : startTap();
$('#undoBtn').onclick = undo;
$('#markBtn').onclick = markGap;
$('#clearBtn').onclick = () => {
  if(!lines.some(l => l.t != null)) return;
  if(!confirm('清除所有時間標記？（歌詞文字會保留）')) return;
  lines = lines.filter(l => l.text !== ''); lines.forEach(l => l.t = null);
  stopTap(true); commit();
};
$('#exportBtn').onclick = () => {
  if(!timed.length){ toast('還沒有任何時間標記'); return; }
  const head = `[ti:${songTitle}]\n` + (offset ? `[offset:${Math.round(offset*1000)}]\n` : '');
  const body = toLRC(lines.map(l => ({...l, t: l.t})));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([head + body + '\n'], {type: 'text/plain;charset=utf-8'}));
  a.download = songTitle.replace(/[\\/:*?"<>|]/g, '_') + '.lrc';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#exportSrtBtn').onclick = () => {
  const cues = timed.filter(l => l.text !== '');
  if(!cues.length){ toast('還沒有任何時間標記'); return; }
  const srtTime = t => {
    let ms = Math.max(0, Math.round(t*1000));
    const h = (ms/3600000)|0; ms -= h*3600000;
    const m = (ms/60000)|0; ms -= m*60000;
    const s = (ms/1000)|0; ms -= s*1000;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + ',' + String(ms).padStart(3,'0');
  };
  const out = [];
  cues.forEach((l, i) => {
    const nx = timed[timed.indexOf(l) + 1];
    out.push(String(i + 1), `${srtTime(l.t)} --> ${srtTime(Math.max(l.t + .5, (nx ? nx.t : l.t + 4) - .05))}`, l.text);
    if(zhMap[l.text]) out.push(zhMap[l.text]);
    out.push('');
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out.join('\r\n')], {type: 'text/plain;charset=utf-8'}));
  a.download = songTitle.replace(/[\\/:*?"<>|]/g, '_') + '.中日雙語.srt';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#lrcInput').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  ta.value = await f.text(); e.target.value = '';
  lines = parse(ta.value); stopTap(true); commit(true);
  toast(`已匯入 ${lines.length} 句`);
};

/* ---------------- lyric rendering ---------------- */
let curLine = null, curEl = null, curWrap = null, curZh = null, redraw = false, nextText = null, nextZhText = null;
let zhMap = {};

function lineSpan(L){
  const k = timed.indexOf(L), nx = timed[k + 1];
  const n = tokenize(L.text).length;
  const gap = (nx ? nx.t : L.t + 6) - L.t;
  return clamp(Math.min(gap - .25, n * .42 + .6), .4, 30);
}
// 把一句拆成顯示單位：［］《》[] 內是和聲；「漢字(かな)」顯示成注音假名
function tokenize(text){
  const units = [];
  let bk = false;
  const re = /([\u4e00-\u9fff々〆ヶ]+)[(（]([\u3041-\u309f\u30a0-\u30ff]+)[)）]|./gsu;
  for(const m of text.matchAll(re)){
    const c = m[0];
    if(c === '［' || c === '《' || c === '['){ bk = true; continue; }
    if(c === '］' || c === '》' || c === ']'){ bk = false; continue; }
    units.push(m[1] ? {base: m[1], ruby: m[2], bk} : {base: c, bk});
  }
  return units;
}
const plainText = t => t.replace(/([\u4e00-\u9fff々〆ヶ]+)[(（][\u3041-\u309f\u30a0-\u30ff]+[)）]/gu, '$1')
  .replace(/^[［《\[](.*?)[］》\]]$/, '$1').replace(/[［《\[](.*?)[］》\]]/g, ' ($1)');
function fitLyricText(el, kind = ''){
  if(!el || !el.textContent.trim() || !stage.clientWidth || !stage.clientHeight) return;
  const preview = kind === 'preview' || kind === 'zhpreview';
  // Measure plain typography so animated transforms do not change the fitted size.
  const probe = el.cloneNode(true);
  probe.removeAttribute('id');
  probe.className = kind === 'preview' ? 'next-measure' : kind === 'zhpreview' ? 'zh-preview' : kind === 'zh' ? 'zhline' : 'line' + (el.classList.contains('allbk') ? ' allbk' : '');
  Object.assign(probe.style, {position:'absolute', visibility:'hidden', pointerEvents:'none',
    width:'max-content', maxWidth:'none', whiteSpace:'nowrap', left:'0', top:'0'});
  probe.style.setProperty('--scale', prefs.scale);
  probe.style.setProperty('--fit', 1);
  probe.setAttribute('aria-hidden', 'true');
  stage.appendChild(probe);
  const naturalWidth = probe.getBoundingClientRect().width;
  const naturalHeight = probe.offsetHeight;
  const availableWidth = slot.clientWidth * .96;
  const maxHeight = stage.clientHeight * (preview ? .12 : .28);
  const oneLineFit = Math.min(1, availableWidth / Math.max(1, naturalWidth));
  const maxLines = oneLineFit >= .74 ? 1 : 2;
  let fit = Math.min(1, oneLineFit * maxLines, maxHeight / Math.max(1, naturalHeight * maxLines));
  probe.style.maxWidth = availableWidth + 'px';
  probe.style.whiteSpace = 'normal';
  for(let i = 0; i < 8; i++){
    probe.style.setProperty('--fit', fit);
    const heightLimit = Math.min(maxHeight, naturalHeight * fit * maxLines + 2);
    if(probe.scrollWidth <= availableWidth + 1 && probe.offsetHeight <= heightLimit + 1) break;
    fit *= Math.min(.94, availableWidth / Math.max(1, probe.scrollWidth), heightLimit / Math.max(1, probe.offsetHeight));
  }
  probe.remove();
  el.style.setProperty('--scale', prefs.scale);
  el.style.setProperty('--fit', fit);
}
function fitDisplayedLyrics(){
  slot.querySelectorAll('.line').forEach(el => fitLyricText(el));
  slot.querySelectorAll('.zhline').forEach(el => fitLyricText(el, 'zh'));
  fitLyricText(nextEl, 'preview');
  fitLyricText(nextZhEl, 'zhpreview');
}
document.fonts?.ready.then(fitDisplayedLyrics);
function showLine(L){
  curLine = L; redraw = false;
  if(curWrap){ const old = curWrap; old.classList.add('leave'); setTimeout(() => old.remove(), 750); curWrap = null; curEl = null; curZh = null; }
  if(L && L.text){
    const k = timed.indexOf(L), hue = HUES[k % HUES.length];
    const wrap = document.createElement('div');
    wrap.className = 'linewrap';
    wrap.style.setProperty('--h', hue);
    const el = document.createElement('div');
    el.className = 'line fx-' + prefs.effect;
    el.style.setProperty('--scale', prefs.scale);
    el.style.setProperty('--h', hue);
    el.style.setProperty('--neon', `hsl(${hue} 100% 62%)`);
    const units = tokenize(L.text);
    if(units.length && units.every(u => u.bk || !u.base.trim())) el.classList.add('allbk');
    el._chars = units.map((u, i) => {
      const s = document.createElement('span');
      s.className = u.bk ? 'ch bk' : 'ch';
      if(u.ruby){ const r = document.createElement('ruby'); r.append(u.base); const rt = document.createElement('rt'); rt.textContent = u.ruby; r.append(rt); s.append(r); }
      else s.textContent = u.base;
      s.style.setProperty('--i', i); s._c = -1;
      el.appendChild(s); return s;
    });
    el._dur = lineSpan(L);
    wrap.appendChild(el);
    const zh = zhMap[L.text];
    if(zh){
      const z = document.createElement('div');
      z.className = 'zhline';
      z.textContent = zh;
      wrap.appendChild(z);
      curZh = z;
    }
    slot.appendChild(wrap); curWrap = wrap; curEl = el;
    fitLyricText(el);
    if(curZh) fitLyricText(curZh, 'zh');
    if(prefs.particles && media.playing()){
      requestAnimationFrame(() => {
        const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        burst(r.left - sr.left + r.width/2, r.top - sr.top + r.height/2, r.width, 30);
      });
    }
  }
  highlightList();
}
function setProgress(el, p){
  const cs = el._chars, n = cs.length;
  for(let i = 0; i < n; i++){
    const c = +clamp(p*n - i, 0, 1).toFixed(3);
    if(c !== cs[i]._c){ cs[i]._c = c; cs[i].style.setProperty('--c', c); }
  }
  if(curZh) curZh.style.setProperty('--p', p.toFixed(3));
}

/* ---------------- particles ---------------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let W = 0, H = 0, P = [];
const COLORS = ['#ff6fae', '#ff9ccc', '#ffd1e6', '#8fd3ff', '#ffffff', '#c9a7ff', '#ffe08a'];
new ResizeObserver(() => {
  const r = stage.getBoundingClientRect(), d = devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = W*d; cv.height = H*d; cx.setTransform(d, 0, 0, d, 0, 0);
  fitDisplayedLyrics();
}).observe(stage);
const rnd = (a, b) => a + Math.random()*(b - a);
const pick = a => a[Math.random()*a.length | 0];

function burst(x, y, w, n){
  const u = W/100;
  for(let i = 0; i < n; i++){
    const a = rnd(0, Math.PI*2), sp = rnd(8, 30)*u;
    P.push({x: x + rnd(-w/2, w/2), y: y + rnd(-u, u), vx: Math.cos(a)*sp*.6, vy: Math.sin(a)*sp*.5 - 6*u, g: 14*u, drag: .9,
      life: 0, max: rnd(.9, 1.7), size: rnd(.7, 1.9)*u, rot: rnd(-1, 1), vr: rnd(-4, 4), sway: 0,
      kind: Math.random() < .55 ? 'heart' : 'star', color: pick(COLORS)});
  }
}
function ambient(){
  const u = W/100;
  P.push({x: rnd(0, W), y: H + 2*u, vx: 0, vy: -rnd(4, 9)*u, g: 0, drag: 1, life: 0, max: rnd(5, 9),
    size: rnd(.8, 2.2)*u, rot: rnd(-.4, .4), vr: rnd(-.6, .6), sway: rnd(1, 3)*u, ph: rnd(0, 6),
    kind: Math.random() < .7 ? 'heart' : 'dot', color: pick(COLORS), alpha: rnd(.35, .7)});
}
function sparkle(x, y){
  const u = W/100;
  P.push({x: x + rnd(-u, u), y: y + rnd(-u, u), vx: rnd(-3, 3)*u, vy: rnd(-8, -3)*u, g: 6*u, drag: .95, life: 0, max: rnd(.5, .9),
    size: rnd(.5, 1.1)*u, rot: 0, vr: rnd(-6, 6), sway: 0, kind: 'star', color: pick(['#fff', '#ffe08a', '#ffc2e0'])});
}
function drawHeart(s){
  cx.beginPath();
  cx.moveTo(0, s*.35);
  cx.bezierCurveTo(-s*.1, s*.15, -s*.55, s*.05, -s*.55, -s*.25);
  cx.bezierCurveTo(-s*.55, -s*.6, -s*.1, -s*.65, 0, -s*.3);
  cx.bezierCurveTo(s*.1, -s*.65, s*.55, -s*.6, s*.55, -s*.25);
  cx.bezierCurveTo(s*.55, s*.05, s*.1, s*.15, 0, s*.35);
  cx.fill();
}
function drawStar(s){
  cx.beginPath();
  for(let i = 0; i < 8; i++){ const r = i % 2 ? s*.22 : s*.6, a = i*Math.PI/4; cx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  cx.closePath(); cx.fill();
}
function stepParticles(dt){
  cx.clearRect(0, 0, W, H);
  if(P.length > 400) P.splice(0, P.length - 400);
  for(let i = P.length - 1; i >= 0; i--){
    const p = P[i];
    p.life += dt;
    if(p.life >= p.max){ P.splice(i, 1); continue; }
    const k = Math.pow(p.drag, dt*60);
    p.vx *= k; p.vy = p.vy*k + p.g*dt;
    p.x += p.vx*dt + (p.sway ? Math.sin(p.life*2 + p.ph)*p.sway*dt : 0);
    p.y += p.vy*dt; p.rot += p.vr*dt;
    const f = p.life/p.max;
    cx.globalAlpha = (p.alpha || 1) * Math.min(1, p.life*6) * (1 - f*f);
    cx.fillStyle = p.color;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    if(p.kind === 'heart') drawHeart(p.size*2);
    else if(p.kind === 'star') drawStar(p.size*2);
    else if(p.kind === 'note'){ cx.font = `700 ${p.size*3}px sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(p.ch, 0, 0); }
    else { cx.beginPath(); cx.arc(0, 0, p.size*.45, 0, 7); cx.fill(); }
    cx.restore();
  }
  cx.globalAlpha = 1;
}

/* ---------------- main loop ---------------- */
let lastTs = performance.now(), ambAcc = 0, sparkAcc = 0, seeking = false, wasPlaying = null, lastSec = -1;
function frame(ts){
  const dt = Math.min(.05, (ts - lastTs)/1000); lastTs = ts;
  const raw = media.time(), dur = media.duration(), now = raw + offset, playing = media.playing();

  if(playing !== wasPlaying){ wasPlaying = playing; $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY; }
  if(dur && !seeking) $('#seek').value = raw/dur*1000;
  if((raw|0) !== lastSec || !dur){ lastSec = raw|0; $('#timeLbl').textContent = fmtShort(raw) + ' / ' + fmtShort(dur); }

  let L = null;
  for(const l of timed){ if(l.t <= now) L = l; else break; }
  if(L !== curLine || redraw) showLine(L);

  if(curEl && L){
    const p = clamp((now - L.t)/curEl._dur, 0, 1);
    setProgress(curEl, p);
    if(prefs.particles && playing && p > 0 && p < 1 && (prefs.effect === 'karaoke' || prefs.effect === 'pop')){
      sparkAcc += dt;
      if(sparkAcc > .09){
        sparkAcc = 0;
        const ch = curEl._chars[Math.min(curEl._chars.length - 1, (p*curEl._chars.length)|0)];
        const r = ch.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        sparkle(r.left - sr.left + r.width/2, r.top - sr.top);
      }
    }
  }

  // 下一句預覽
  let nt = '', ntz = '';
  if(prefs.next){
    const k = L ? timed.indexOf(L) + 1 : 0, nx = timed[k];
    if(nx && nx.text && (L || now > nx.t - 4)){ nt = plainText(nx.text); ntz = zhMap[nx.text] || ''; }
  }
  if(nt !== nextText){ nextText = nt; nextEl.textContent = nt || ' '; nextEl.classList.toggle('off', !nt); fitLyricText(nextEl, 'preview'); }
  if(ntz !== nextZhText){ nextZhText = ntz; nextZhEl.textContent = ntz || ' '; nextZhEl.classList.toggle('off', !ntz); fitLyricText(nextZhEl, 'zhpreview'); }

  // 片頭標題卡：還沒有字幕時顯示
  $('#titlecard').classList.toggle('show', !L && (!timed.length || now < timed[0].t - 4) && !tapping);

  if(prefs.particles && playing){ ambAcc += dt; if(ambAcc > .22){ ambAcc = 0; ambient(); } }
  if(window.Dance) Dance.frame(dt, playing);
  stepParticles(dt);
  requestAnimationFrame(frame);
}

/* ---------------- controls ---------------- */
$('#playBtn').onclick = () => media.toggle();
$('#catcher').onclick = () => media.toggle();
$('#catcher').ondblclick = () => toggleFs();
const seekEl = $('#seek');
seekEl.addEventListener('input', () => { seeking = true; });
seekEl.addEventListener('change', () => { media.seek(seekEl.value/1000*media.duration()); seeking = false; });
function toggleFs(){ document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen?.(); }
$('#fsBtn').onclick = toggleFs;

document.querySelectorAll('#effects button').forEach(b => {
  b.onclick = () => { prefs.effect = b.dataset.fx; savePrefs(); syncOpts(); redraw = true; };
});
$('#scale').oninput = e => { prefs.scale = +e.target.value; savePrefs(); fitDisplayedLyrics(); };
$('#partChk').onchange = e => { prefs.particles = e.target.checked; savePrefs(); };
$('#dimChk').onchange = e => { prefs.dim = e.target.checked; savePrefs(); syncOpts(); };
$('#nextChk').onchange = e => { prefs.next = e.target.checked; savePrefs(); };
$('#danceChk').onchange = e => {
  prefs.dance = e.target.checked; savePrefs(); syncOpts();
  if(!prefs.dance) window.Dance?.clear();
  if(curSong && media.kind === 'yt'){ const ytEl = document.getElementById('yt'); if(ytEl) ytEl.style.visibility = prefs.dance ? 'hidden' : ''; showCover(prefs.dance ? curSong : null); }
};
document.querySelectorAll('[data-off]').forEach(b => b.onclick = () => {
  offset = +(offset + +b.dataset.off).toFixed(1);
  $('#offLbl').textContent = (offset > 0 ? '+' : '') + offset.toFixed(1) + 's';
  commit(true);
});
function syncOpts(){
  document.querySelectorAll('#effects button').forEach(b => b.classList.toggle('on', b.dataset.fx === prefs.effect));
  $('#scale').value = prefs.scale; nextEl.style.setProperty('--scale', prefs.scale);
  $('#partChk').checked = prefs.particles; $('#dimChk').checked = prefs.dim; $('#nextChk').checked = prefs.next;
  $('#dim').classList.toggle('off', !prefs.dim);
  $('#danceChk').checked = prefs.dance; $('#dance').hidden = !prefs.dance;
  stage.classList.toggle('dancing', prefs.dance);
  $('#danceControls').hidden = !prefs.dance;
  $('#danceStyle').value = prefs.danceStyle;
  $('#danceLead').value = prefs.danceLead;
  $('#danceEnergy').value = prefs.danceEnergy;
}
for(const [id, key] of [['danceStyle','danceStyle'], ['danceLead','danceLead'], ['danceEnergy','danceEnergy']]){
  $('#'+id).addEventListener(key === 'danceEnergy' ? 'input' : 'change', e => {
    prefs[key] = key === 'danceEnergy' ? +e.target.value : e.target.value;
    savePrefs();
  });
}

// 點過的按鈕失去焦點，避免 Space 又觸發按鈕
document.addEventListener('pointerup', () => {
  const a = document.activeElement;
  if(a && (a.tagName === 'BUTTON' || (a.tagName === 'INPUT' && /range|checkbox/.test(a.type)))) setTimeout(() => a.blur(), 0);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if(t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !/range|checkbox|file/.test(t.type))) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  switch(e.key){
    case ' ': e.preventDefault(); tapping ? stamp() : media.toggle(); break;
    case 'Enter': if(tapping){ e.preventDefault(); stamp(); } break;
    case 'Backspace': case 'z': if(tapping){ e.preventDefault(); undo(); } break;
    case '.': markGap(); break;
    case 'k': media.toggle(); break;
    case 'ArrowLeft': e.preventDefault(); media.seek(media.time() - 3); break;
    case 'ArrowRight': e.preventDefault(); media.seek(media.time() + 3); break;
    case 'f': toggleFs(); break;
    case 'Escape': if(tapping) stopTap(); break;
  }
});

let toastTimer;
function toast(s){ const el = $('#toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

/* ---------------- boot ---------------- */
syncOpts();
const firstId = songs.some(s => s.id === prefs.lastSong) ? prefs.lastSong : (songs[0] || DEFAULT_SONGS[0]).id;
mediaKey = 'yt:' + firstId;
preloadFiles().then(() => playSong(firstId, false));
if(location.protocol === 'file:') showMsg('YouTube 需要透過網址開啟本頁，請在這個資料夾執行：<br><code>python3 -m http.server 8765</code><br>再打開 http://localhost:8765');
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
requestAnimationFrame(frame);
</script>
