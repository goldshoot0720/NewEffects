<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NewEffects 角色圖鑑。探索十位角色的立繪與正面、側面、背面設定。">
<title>角色圖鑑 · NewEffects</title>
<script>
  const query = new URLSearchParams(location.search);
  if (['song', 'mode', 'render', 't'].some(key => query.has(key))) {
    location.replace('pv.html' + location.search + location.hash);
  }
</script>
<link rel="stylesheet" href="archive.css">
<script src="archive.js" defer></script>
</head>
<body id="character-archive">
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="index.html" aria-label="NewEffects 角色圖鑑">
      <svg width="33" height="33" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M16 5c0 6.1 4.9 11 11 11-6.1 0-11 4.9-11 11 0-6.1-4.9-11-11-11 6.1 0 11-4.9 11-11Z" fill="white"/><circle cx="16" cy="16" r="2.5" fill="currentColor"/></svg>
      <span>NewEffects<small>CHARACTER STUDIO</small></span>
    </a>
    <nav aria-label="主選單">
      <a href="#collection" aria-current="page">角色圖鑑</a>
      <a href="pv.html">歌詞 PV</a>
      <a href="v2.html">歌詞播放器</a>
    </nav>
  </div>
</header>
<main class="shell">
  <section class="hero" aria-labelledby="page-title">
    <div class="intro">
      <p class="eyebrow"><span class="dot"></span> CHARACTER ARCHIVE <span class="volume">/ VOL. 01</span></p>
      <h1 id="page-title">角色圖鑑<span>.</span></h1>
      <p class="intro-text">從奇幻精靈到街頭貓咪，收錄十位角色的全身立繪與三視圖。轉個角度，看看造型裡的小細節。</p>
      <a class="primary" href="#collection">瀏覽角色 <span aria-hidden="true">↓</span></a>
      <dl class="stats">
        <div><dt>收錄角色</dt><dd>10</dd></div>
        <div><dt>參考圖</dt><dd>20</dd></div>
        <div><dt>分類</dt><dd>04</dd></div>
      </dl>
    </div>
    <button class="feature" type="button" data-character="dragon" aria-label="查看精選角色白龍精靈">
      <img src="assets/characters/dragon-feature.webp" width="900" height="640" alt="">
      <span class="feature-label"><span class="dot"></span> 精選角色 <span>01 / 10</span></span>
      <span class="feature-name"><small>DRAGON ELF</small>白龍精靈</span>
      <span class="feature-arrow" aria-hidden="true">↗</span>
    </button>
  </section>

  <section id="collection" class="collection" aria-labelledby="collection-title">
    <p class="eyebrow"><span class="dot"></span> THE COLLECTION</p>
    <div class="collection-heading">
      <h2 id="collection-title">探索角色</h2>
      <p id="result-count" class="result-count" role="status">10 位角色</p>
    </div>
    <div id="filters" class="filters" role="group" aria-label="角色分類">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="fantasy" aria-pressed="false">奇幻</button>
      <button type="button" data-filter="anime" aria-pressed="false">動漫</button>
      <button type="button" data-filter="animal" aria-pressed="false">動物擬人</button>
      <button type="button" data-filter="real" aria-pressed="false">寫實</button>
    </div>
    <div id="cards" class="cards"></div>
  </section>
</main>

<footer class="shell footer">
  <span>NewEffects <span class="footer-divider">/</span> CHARACTER ARCHIVE</span>
  <a href="cast.html">透明切圖庫 <span aria-hidden="true">↗</span></a>
</footer>

<dialog id="detail" aria-labelledby="detail-title">
  <div class="detail-heading">
    <div><p id="detail-index" class="eyebrow"></p><h2 id="detail-title"></h2></div>
    <form method="dialog"><button class="icon-button" aria-label="關閉角色詳情" autofocus>×</button></form>
  </div>
  <div id="views" class="filters views" role="group" aria-label="參考圖類型"></div>
  <div class="detail-art"><img id="detail-image" alt=""></div>
  <div class="detail-footer">
    <span id="detail-caption"></span>
    <a id="download" download>下載圖片 <span aria-hidden="true">↓</span></a>
  </div>
</dialog>
</body>
</html>
