<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEST 4U PV</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#000;color:#eee;font-family:"PingFang TC","Hiragino Sans",sans-serif;overflow:hidden}
/* 底部留給控制列：畫布不鋪滿整個視窗，歌詞才不會被播放器蓋住。
   實際高度由 JS 量 #ui 後寫進 --ui-h，控制列換行或放大時也跟得上。 */
body{--ui-h:104px;display:grid;place-items:center;box-sizing:border-box;padding-bottom:var(--ui-h)}
#pv{width:min(100vw,calc((100vh - var(--ui-h))*16/9));height:auto;aspect-ratio:16/9;display:block;background:#000}
#ui{position:fixed;left:50%;bottom:16px;translate:-50% 0;display:flex;gap:10px;align-items:center;padding:10px 14px;
  border-radius:14px;background:rgba(18,18,28,.82);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.4);
  width:min(1120px,calc(100vw - 32px));box-sizing:border-box;transition:opacity .4s;flex-wrap:wrap}
#ui.idle{opacity:0}
#ui:focus-within,#ui:hover{opacity:1}
#ui select,#ui button{font:inherit;font-size:14px;color:#fff;background:#2c2c40;border:1px solid #47476a;border-radius:8px;padding:6px 10px;cursor:pointer}
#ui button:disabled{opacity:.5;cursor:wait}
#seek{flex:1;min-width:80px;accent-color:#f6a531}
.seek-controls{display:flex;align-items:center;gap:6px;flex:1;min-width:180px}
#song{min-width:0;max-width:100%;flex:0 1 240px}
.transport{display:flex;align-items:center;gap:8px;flex:none}
.volume-control{display:flex;align-items:center;gap:6px;flex:none}
#ui #mute{padding:5px;width:36px;height:32px}
#volume{width:80px;accent-color:#f6a531}
#volumeValue{font-size:12px;min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
#time{font:13px Menlo,monospace;white-space:nowrap}
#ui a{color:#9fd2ff;font-size:13px;white-space:nowrap}
.player-links{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;flex-basis:100%;order:6}
#msg{position:fixed;top:16px;left:50%;translate:-50% 0;font-size:14px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:8px}
#msg:empty{display:none}
body.render #ui,body.render #msg{display:none}
body.render{padding-bottom:0}
body.render #pv{width:min(100vw,calc(100vh*16/9))}
@media (max-width:600px){#ui{flex-wrap:wrap}.seek-controls{order:5;flex-basis:100%}}
</style>
</head>
<body>
<canvas id="pv" width="1920" height="1080"></canvas>
<div id="ui">
  <select id="song" aria-label="歌曲"></select>
  <div class="transport" role="group" aria-label="播放控制">
    <button id="prevSong" type="button" aria-label="上一首" title="上一首">⏮ 上一首</button>
    <button id="play" disabled>載入中…</button>
    <button id="nextSong" type="button" aria-label="下一首" title="下一首">下一首 ⏭</button>
  </div>
  <div class="seek-controls" role="group" aria-label="播放位置控制">
    <button id="rewind5" type="button" aria-label="倒退 5 秒" title="倒退 5 秒" disabled>−5秒</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放位置">
    <button id="forward5" type="button" aria-label="快轉 5 秒" title="快轉 5 秒" disabled>+5秒</button>
  </div>
  <span id="time">0:00 / 0:00</span>
  <div class="volume-control" role="group" aria-label="音量控制">
    <button id="mute" type="button" aria-label="靜音" aria-pressed="false" title="靜音" disabled>🔊</button>
    <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量" disabled>
    <span id="volumeValue">100%</span>
  </div>
  <nav class="player-links" aria-label="播放器頁面">
    <a id="modeLink" href="pv.html?mode=characters">人物 PV</a>
    <a href="index.html">角色圖鑑</a>
    <a href="cast.html">切圖</a>
    <a href="v2.html">第二版本：歌詞播放器 →</a>
  </nav>
</div>
<div id="msg"></div>
<script>
// 量控制列實際高度，讓畫布自動讓開（換行、縮放、字體變大都不會蓋到歌詞）
(() => {
  const ui = document.getElementById('ui');
  const fit = () => document.body.style.setProperty('--ui-h', (ui.offsetHeight + 26) + 'px');
  addEventListener('resize', fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(ui);
  fit();
})();
</script>
<script src="dance-rig.js"></script>
<script src="volume.js"></script>
<script src="playlist-order.js"></script>
<script src="lyric-text.js"></script>
<script src="pv.js"></script>
</body>
</html>
