<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人物切圖一覽</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101522;color:#edf3ff;font-family:"PingFang TC",system-ui,sans-serif}
header{padding:24px 5vw;display:flex;flex-wrap:wrap;gap:18px;align-items:center;border-bottom:1px solid #2d3c55}
h1{font-size:22px;margin:0}a{color:#a5d7ff;text-decoration:none}main{max-width:1500px;margin:auto;padding:24px}
section{margin-bottom:40px}h2{font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
figure{margin:0;padding:12px;border:1px solid #35435c;border-radius:12px;background:linear-gradient(135deg,#273548,#1a2536)}
img{width:100%;height:310px;object-fit:contain;display:block}figcaption{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:13px;color:#bbc9dc}
#status{color:#b5cbdf;font-size:14px}@media(max-width:500px){main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}img{height:250px}figure{padding:8px}}
[hidden]{display:none!important}.retry{display:block;margin:1em auto;padding:.6em 1em}
</style>
</head>
<body>
<header><h1>人物切圖一覽</h1><a href="pv.html?mode=characters">播放人物 PV →</a><a href="pv.html">歌詞 PV</a><a href="characters.html">角色圖鑑</a><a href="v2.html">歌詞播放器</a><span id="status" role="status">載入切圖…</span></header>
<main id="gallery"></main>
<script>
const groups=[['casual','制服與便服',12],['rooftop','屋頂制服',6],['idol','RISE 演出服',5],['stage','黃昏舞台服',9],['anaru','生徒会六人',6],['lucky','招財喵布布八人',8],['kaguya','超かぐや姫！三人',3],['aiura','あいうら三人',3],['growup','ひまわりサーカス十人',10],['vwest','V西2025 · 選手與監督',17],['forever','メモリーズオフ 双想 六人',6],['tsuki','月に向かって撃て 十一人',11],['kaze','風の中 七人（含封面少女）',7],['osewa','才女のお世話 八人',8],['fx','FX戦士くるみちゃん 四人',4],['rolling','ローリング☆ガールズ 四人',4],['matryoshka','マトリョーシカ 九人',9],['kaiji','逆境無頼カイジ 八人',8],['inside','INSIDE IDENTITY 四人',4],['major','メジャー 六人與鳴海星來',7],['since','SINce Memories 五人',5]];
// 舊九人合圖不再展示，自動補入素材時也略過。
const excludedGroups=new Set(['mirai']);
(async()=>{
  const response=await fetch('assets/ref/cast/cast.json');if(!response.ok)throw new Error('找不到人物清單');
  const cast=await response.json();let loaded=0,failed=0;
  // 之後新增的切圖只要寫進 cast.json，就算沒補到上面的順序表也會自動排在最後，不會整組消失
  const listed=new Set(groups.map(([key])=>key));
  for(const [key,list] of Object.entries(cast)) if(!listed.has(key)&&!excludedGroups.has(key)) groups.push([key,key,list.length]);
  const total=groups.reduce((sum,[key])=>sum+(cast[key]?.length||0),0);
  const incomplete=groups.filter(([key,,expected])=>cast[key]?.length!==expected).map(([,title])=>title);
  function updateStatus(){
    const notes=[`${loaded} / ${total} 張透明 PNG 已載入`];
    if(failed) notes.push(`${failed} 張讀取失敗，可重新載入`);
    if(incomplete.length) notes.push('切圖未齊全：'+incomplete.join('、'));
    document.getElementById('status').textContent=notes.join(' · ');
  }
  for(const [key,title] of groups){
    const list=cast[key]||[];
    const section=document.createElement('section'),heading=document.createElement('h2'),grid=document.createElement('div');
    heading.textContent=`${title} · ${list.length} 張`;grid.className='grid';section.append(heading,grid);document.getElementById('gallery').append(section);
    for(const [i,item] of list.entries()){
      const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption'),name=document.createElement('span'),link=document.createElement('a');
      const retry=document.createElement('button');
      retry.type='button';retry.className='retry';retry.hidden=true;retry.textContent='重新載入圖片';
      image.alt=item.name || `${title}人物 ${i+1}`;
      retry.setAttribute('aria-label','重新載入'+image.alt);
      name.textContent=`${item.name || String(i+1).padStart(2,'0')} · ${item.w}×${item.h}`;
      link.href='assets/ref/cast/'+item.file;link.download=item.file;link.textContent='下載';link.hidden=true;
      image.onload=()=>{loaded++;image.hidden=link.hidden=false;updateStatus();};
      image.onerror=()=>{failed++;image.hidden=true;retry.hidden=false;updateStatus();};
      retry.onclick=()=>{
        retry.hidden=true;failed--;updateStatus();
        const url=new URL(link.href);url.searchParams.set('retry',Date.now());image.src=url.href;
      };
      caption.append(name,link);figure.append(image,retry,caption);grid.append(figure);
      image.src=link.href;
    }
  }
  updateStatus();
})().catch(e=>{document.getElementById('status').textContent='錯誤：'+e.message;});
</script>
</body></html>
