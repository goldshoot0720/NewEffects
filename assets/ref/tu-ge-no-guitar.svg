<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">塗哥不會彈吉他</title>
  <desc id="desc">水電王子塗哥右手拿管子鉗，左手邊的木吉他被紅色禁止符號蓋住。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.46" stop-color="#1b130f"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="58%" cy="24%" r="46%">
      <stop offset="0" stop-color="#f0a35a" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#c46a28" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c46a28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2c2c2"/>
      <stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
    <linearGradient id="jean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa0cf"/>
      <stop offset="1" stop-color="#3c6294"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d2ad"/>
      <stop offset="1" stop-color="#e3b286"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a15a"/>
      <stop offset="1" stop-color="#8a4b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <ellipse cx="500" cy="900" rx="180" ry="22" fill="#000" opacity="0.4"/>

  <g font-family="PingFang TC, Hiragino Sans GB, Noto Sans TC, sans-serif" text-anchor="middle" fill="#fff8ee">
    <text x="400" y="68" font-size="44" font-weight="700">塗哥不會彈吉他</text>
    <text x="400" y="104" font-size="18" fill="#f0c9a2">水電王子塗三傑 · 手邊是管子鉗</text>
  </g>

  <!-- guitar, kept clear of the figure -->
  <g>
    <rect x="118" y="214" width="16" height="168" rx="3" fill="url(#wood)" stroke="#3a2416" stroke-width="2"/>
    <rect x="108" y="188" width="36" height="28" rx="4" fill="#c9843f" stroke="#3a2416" stroke-width="2"/>
    <path d="M124 188 v-16 M136 188 v-16" stroke="#eee" stroke-width="2"/>
    <ellipse cx="126" cy="470" rx="58" ry="78" fill="url(#wood)" stroke="#3a2416" stroke-width="3"/>
    <ellipse cx="126" cy="456" rx="22" ry="22" fill="#2a160e"/>
    <circle cx="126" cy="456" r="8" fill="#f0ddc2"/>
    <path d="M126 214 v150" stroke="#f4e2c4" stroke-width="1.4" opacity="0.8"/>
    <circle cx="126" cy="456" r="96" fill="none" stroke="#e23b3b" stroke-width="12"/>
    <path d="M58 388 L194 524" stroke="#e23b3b" stroke-width="12" stroke-linecap="round"/>
    <text x="126" y="620" font-family="PingFang TC, sans-serif" font-size="18" fill="#f0c9a2" text-anchor="middle">吉他</text>
  </g>

  <!-- 塗哥 -->
  <g>
    <!-- jeans -->
    <path d="M452 560 h42 l-6 250 h-42 z" fill="url(#jean)"/>
    <path d="M514 560 h42 l6 250 h-42 z" fill="url(#jean)"/>
    <path d="M444 552 h120 v24 h-120 z" fill="#314e78"/>
    <!-- shoes -->
    <g fill="#f5f5f5" stroke="#222" stroke-width="2">
      <path d="M430 800 h58 l12 18 c-10 16-58 16-74 2 z"/>
      <path d="M522 800 h58 l14 20 c-12 14-60 12-76-2 z"/>
    </g>
    <path d="M446 812 h24 M538 812 h24" stroke="#222" stroke-width="3" stroke-linecap="round"/>

    <!-- arms, drawn under the shirt sleeves -->
    <path d="M438 400 C400 430 372 470 360 512" fill="none" stroke="#e3b286" stroke-width="28" stroke-linecap="round"/>
    <path d="M574 400 C620 424 648 450 656 478" fill="none" stroke="#e3b286" stroke-width="26" stroke-linecap="round"/>
    <!-- open palm -->
    <g transform="translate(668 492)">
      <ellipse cx="0" cy="6" rx="16" ry="18" fill="#f3c7a0" stroke="#c48a62" stroke-width="2"/>
      <path d="M-10 -4 v-18 M-3 -8 v-22 M5 -8 v-20 M12 -4 v-16" stroke="#e8bc94" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- wrench -->
    <g transform="translate(360 508)">
      <circle cx="0" cy="6" r="15" fill="#f3c7a0" stroke="#c48a62" stroke-width="2"/>
      <rect x="-6" y="16" width="12" height="78" rx="2" fill="#d5d8dc" stroke="#3e4348" stroke-width="2"/>
      <path d="M-6 86 h30 v12 H8 c3 18 14 28 28 28 12 0 18-8 18-8l-9-8s-4 5-9 5c-8 0-14-8-16-18h10v-11z" fill="#d5d8dc" stroke="#3e4348" stroke-width="2" stroke-linejoin="round"/>
      <text x="8" y="156" font-family="PingFang TC, sans-serif" font-size="18" fill="#f0c9a2" text-anchor="middle">管子鉗</text>
    </g>

    <!-- torso -->
    <path d="M430 360 h148 c16 0 26 12 26 26 v150 c0 22-16 34-36 34 h-128 c-20 0-36-12-36-34 v-150 c0-14 10-26 26-26 z" fill="url(#shirt)"/>
    <rect x="474" y="430" width="64" height="30" rx="4" fill="#f7f7f7"/>
    <text x="506" y="451" font-family="PingFang TC, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">水電</text>

    <!-- neck and head -->
    <rect x="478" y="332" width="48" height="36" rx="12" fill="url(#skin)"/>
    <ellipse cx="502" cy="268" rx="72" ry="80" fill="url(#skin)"/>
    <path d="M438 250 C434 168 502 142 572 168 C592 184 586 236 572 258 C548 214 468 206 442 248 Z" fill="#1a1a1a"/>
    <path d="M446 246 C470 228 532 226 562 248 C548 232 470 230 446 246 Z" fill="#1a1a1a"/>
    <ellipse cx="434" cy="286" rx="9" ry="14" fill="#e8b890"/>
    <ellipse cx="570" cy="286" rx="9" ry="14" fill="#e8b890"/>
    <path d="M456 248 Q474 236 492 250" fill="none" stroke="#2a211c" stroke-width="4" stroke-linecap="round"/>
    <path d="M516 250 Q534 236 552 248" fill="none" stroke="#2a211c" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="474" cy="278" rx="8" ry="9" fill="#2b211c"/>
    <ellipse cx="538" cy="278" rx="8" ry="9" fill="#2b211c"/>
    <circle cx="476" cy="276" r="2.2" fill="#fff"/>
    <circle cx="540" cy="276" r="2.2" fill="#fff"/>
    <path d="M494 312 q8 8 16 0" fill="none" stroke="#d09070" stroke-width="3" stroke-linecap="round"/>
    <path d="M476 332 q26 22 52 0" fill="none" stroke="#a85a48" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M488 330 q14 12 28 0" fill="#e07a72"/>
  </g>

  <g font-family="PingFang TC, Hiragino Sans GB, Noto Sans TC, sans-serif" text-anchor="middle">
    <rect x="90" y="908" width="620" height="68" rx="14" fill="#14110f" stroke="#f0c9a2" stroke-opacity="0.4"/>
    <text x="400" y="936" font-size="20" fill="#fff8ee">歌詞沒有派吉他給他</text>
    <text x="400" y="962" font-size="16" fill="#f0c9a2">會唱〈快樂天堂〉，本業仍是修水電</text>
  </g>
</svg>
